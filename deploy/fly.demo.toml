# Public demo of the full app (studio, prep, editor). DEMO_MODE keeps
# recordings in the browser, blocks file uploads, caps clips/screenshots/
# branding, and wipes everything every 25 minutes. It uses the default
# passwords on purpose: the demo's info panel lists them.
#
# No volume: the data is throwaway. The machine stops when nobody is
# connected and starts on the next visit, so an idle demo costs almost nothing.
#
#   fly deploy -c deploy/fly.demo.toml --image ghcr.io/oooshiny/podcast-studio:<sha>
app = "doyourpod-demo"
primary_region = "iad"

[env]
  DEMO_MODE = "1"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
